name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check generated assets
        run: |
          python tools/build_ui_font.py --check
          python tools/build_ui_icons.py --check
          python tools/build_ui_sounds.py --check
          python tools/build_material_noise.py --check
      - name: Host contract tests
        run: python -m unittest discover -s tests -v
