[platformio]
core_dir = .pio-core

[env:tab5]
platform = file://.pio/platform-tab5
board = m5stack-tab5-p4
framework = arduino
board_build.partitions = partitions.csv
lib_ldf_mode = deep+
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Wl,--wrap=i2s_channel_enable
    -Wl,--wrap=i2s_channel_write
build_unflags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts =
    pre:tools/usb_fs_patch.py
    pre:tools/ble_security_patch.py
    pre:tools/ble_ecc_patch.py
lib_deps =
    https://github.com/m5stack/M5Unified.git#0.2.28
    https://github.com/m5stack/M5GFX.git#0.2.35
    bblanchon/ArduinoJson @ ^7.4.2
